name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run finance module test suite (against real PostgreSQL)
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gemas_test
          JWT_SECRET: ci-test-secret-minimal-32-karakter-xxxxxxx

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Test Portainer authentication
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: |
          set -euo pipefail

          code=$(curl -sk \
            -o /tmp/portainer_auth.json \
            -w "%{http_code}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/status")

          echo "Portainer API HTTP status: $code"

          if [ "$code" -ne 200 ]; then
            echo "::error::Portainer authentication failed"
            exit 1
          fi

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          STACK_POSTGRES_DB: ${{ secrets.STACK_POSTGRES_DB }}
          STACK_POSTGRES_USER: ${{ secrets.STACK_POSTGRES_USER }}
          STACK_POSTGRES_PASSWORD: ${{ secrets.STACK_POSTGRES_PASSWORD }}
          STACK_JWT_SECRET: ${{ secrets.STACK_JWT_SECRET }}
          STACK_CLIENT_ORIGIN: ${{ secrets.STACK_CLIENT_ORIGIN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          jq -n \
            --arg password "$GH_PAT" \
            --arg postgres_db "$STACK_POSTGRES_DB" \
            --arg postgres_user "$STACK_POSTGRES_USER" \
            --arg postgres_password "$STACK_POSTGRES_PASSWORD" \
            --arg jwt_secret "$STACK_JWT_SECRET" \
            --arg client_origin "$STACK_CLIENT_ORIGIN" \
            --arg image_tag "$IMAGE_TAG" \
            '{
              pullImage: true,
              repositoryAuthentication: true,
              repositoryUsername: "pipi2303",
              repositoryPassword: $password,
              env: [
                {name: "POSTGRES_DB", value: $postgres_db},
                {name: "POSTGRES_USER", value: $postgres_user},
                {name: "POSTGRES_PASSWORD", value: $postgres_password},
                {name: "JWT_SECRET", value: $jwt_secret},
                {name: "CLIENT_ORIGIN", value: $client_origin},
                {name: "IMAGE_TAG", value: $image_tag}
              ]
            }' > /tmp/portainer_payload.json

          code=$(curl -sk \
            -o /tmp/portainer_response.json \
            -w "%{http_code}" \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/portainer_payload.json \
            "${PORTAINER_URL}/api/stacks/${PORTAINER_STACK_ID}/git/redeploy?endpointId=3")

          echo "HTTP status: $code"

          echo "Portainer response:"
          jq -c 'del(.env, .repositoryPassword, .password, .token)' \
            /tmp/portainer_response.json 2>/dev/null || \
            echo "(response bukan JSON)"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Portainer redeploy failed with HTTP $code"
            exit 1
          fi

      # Audit gap fix (Infra & Ops): sebelumnya job ini berhenti begitu Portainer
      # MENERIMA permintaan redeploy (HTTP 2xx) -- tidak pernah dicek apakah
      # container baru benar-benar naik & sehat setelahnya. Kalau image baru
      # gagal start (mis. migrasi/env var salah), pipeline tetap melapor
      # "sukses" padahal produksi sedang down. Dockerfile sudah punya
      # HEALTHCHECK yang hit /api/health (lihat db.ts getPool().query('SELECT 1')),
      # jadi di sini kita poll endpoint publik yang sama lewat STACK_CLIENT_ORIGIN
      # (secret yang sama dipakai utk CORS) sampai sehat atau timeout.
      - name: Wait for deployment health check
        env:
          STACK_CLIENT_ORIGIN: ${{ secrets.STACK_CLIENT_ORIGIN }}
        run: |
          set -euo pipefail

          HEALTH_URL="${STACK_CLIENT_ORIGIN%/}/api/health"
          echo "Menunggu $HEALTH_URL sehat (maks 5 menit)..."

          for i in $(seq 1 30); do
            code=$(curl -sk -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$code" -eq 200 ]; then
              echo "Deployment sehat setelah percobaan ke-$i (HTTP 200)."
              cat /tmp/health_response.json 2>/dev/null || true
              exit 0
            fi
            echo "Percobaan $i/30: HTTP $code, coba lagi dalam 10 detik..."
            sleep 10
          done

          echo "::error::Deployment baru tidak sehat setelah 5 menit (endpoint /api/health tidak pernah 200). Periksa log container di Portainer -- rollback manual mungkin diperlukan."
          exit 1
