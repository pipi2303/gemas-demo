name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run finance module test suite (against real PostgreSQL)
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gemas_test
          JWT_SECRET: ci-test-secret-minimal-32-karakter-xxxxxxx

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Test Portainer authentication
        run: |
          code=$(curl -sk -o /tmp/portainer_auth.json -w "%{http_code}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            "${{ secrets.PORTAINER_URL }}/api/status")

          echo "Portainer API HTTP status: $code"

          if [ "$code" -ne 200 ]; then
            echo "::error::Portainer authentication failed"
            exit 1
          fi

      - name: Trigger Portainer redeploy
        run: |
          code=$(curl -sk -o /tmp/portainer_response.json -w "%{http_code}" \
            -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "pullImage": true,
              "repositoryAuthentication": true,
              "repositoryUsername": "pipi2303",
              "repositoryPassword": "${{ secrets.GH_PAT }}",
              "env": [
                {"name": "POSTGRES_DB", "value": "${{ secrets.STACK_POSTGRES_DB }}"},
                {"name": "POSTGRES_USER", "value": "${{ secrets.STACK_POSTGRES_USER }}"},
                {"name": "POSTGRES_PASSWORD", "value": "${{ secrets.STACK_POSTGRES_PASSWORD }}"},
                {"name": "JWT_SECRET", "value": "${{ secrets.STACK_JWT_SECRET }}"},
                {"name": "CLIENT_ORIGIN", "value": "${{ secrets.STACK_CLIENT_ORIGIN }}"},
                {"name": "IMAGE_TAG", "value": "${{ github.sha }}"}
              ]
            }' \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}/git/redeploy?endpointId=3"

          echo "HTTP status: $code"

          echo "Portainer response:"
          jq -c 'del(.env, .repositoryPassword, .password, .token)' \
            /tmp/portainer_response.json 2>/dev/null || \
            echo "(response bukan JSON)"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Portainer redeploy failed with HTTP $code"
            exit 1
          fi
