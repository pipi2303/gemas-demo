services:

  gemas_db:
    image: postgres:16-alpine
    container_name: gemas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gemas_postgres_data:/var/lib/postgresql/data
    networks:
      - gemas_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gemas:
    image: ghcr.io/pipi2303/dev-gemas:${IMAGE_TAG:-latest}
    container_name: gemas
    ports:
      - "8091:5411"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gemas_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      PORT: 5411
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://123.176.120.78:8091}
      NODE_ENV: production
    volumes:
      - gemas_backups:/app/backups
    networks:
      - gemas_net
    depends_on:
      gemas_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

networks:
  gemas_net:
    driver: bridge

volumes:
  gemas_postgres_data:
  gemas_backups:
